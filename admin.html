<style>
:root {
  --font-sans: 'Plus Jakarta Sans', 'Noto Sans Bengali', 'Noto Sans Devanagari', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --bg: #070b14;
  --card: rgba(30, 41, 59, 0.52);
  --card-hover: rgba(30, 41, 59, 0.78);
  --inp: rgba(15, 23, 42, 0.85);
  --bd: rgba(255, 255, 255, 0.1);
  --bd-hover: rgba(255, 255, 255, 0.22);
  --glass-highlight: inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
  --tx: #f8fafc;
  --mu: #94a3b8;
  --ac: #f59e0b;
  --ac-light: #fbbf24;
  --wa-border: #22c55e;
  --er-border: #ef4444;
  color-scheme: dark;
}

html[data-theme="light"] {
  --bg: #f8fafc;
  --card: rgba(255, 255, 255, 0.88);
  --card-hover: #ffffff;
  --inp: rgba(255, 255, 255, 0.95);
  --bd: rgba(15, 23, 42, 0.12);
  --bd-hover: rgba(15, 23, 42, 0.28);
  --glass-highlight: inset 0 1px 0 0 rgba(255, 255, 255, 0.9);
  --tx: #0f172a;
  --mu: #475569;
  --ac: #92400e;
  --ac-light: #b45309;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }

/* Custom Accent Scrollbars */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--ac) rgba(15, 23, 42, 0.25);
}
::-webkit-scrollbar { width: 8px; height: 6px; }
::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.25); border-radius: 99px; }
::-webkit-scrollbar-thumb { background: var(--ac); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--ac-light); }

body {
  margin: 0;
  font: 16px/1.5 var(--font-sans);
  color: var(--tx);
  background-color: var(--bg);
  background-image:
    radial-gradient(650px 450px at 10% 0%, rgba(59, 130, 246, 0.15), transparent),
    radial-gradient(600px 450px at 90% 10%, rgba(245, 158, 11, 0.10), transparent);
  min-height: 100dvh;
  padding-bottom: 104px;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.3s ease, color 0.3s ease;
}

header {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
  background: rgba(7, 11, 20, 0.84);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--bd);
}
html[data-theme="light"] header { background: rgba(248, 250, 252, 0.86); }

header img { width: 38px; height: 38px; border-radius: 50%; flex: none; }
header h1 { font-size: 1.02rem; margin: 0; flex: 1; min-width: 120px; line-height: 1.25; font-weight: 800; }
header small { display: block; color: var(--mu); font-weight: 500; font-size: 0.75rem; }
header a {
  color: var(--mu);
  font-size: 0.82rem;
  font-weight: 600;
  text-decoration: none;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--bd);
  background: var(--card);
}
header a:hover { color: var(--tx); border-color: var(--bd-hover); }

/* Header Visitor Badge */
.v-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.76rem;
  font-weight: 700;
  padding: 5px 10px;
  border-radius: 99px;
  background: rgba(59, 130, 246, 0.14);
  border: 1px solid rgba(59, 130, 246, 0.38);
  color: #60a5fa;
  font-family: var(--font-mono);
  white-space: nowrap;
  cursor: pointer;
}
html[data-theme="light"] .v-pill { color: #1d4ed8; background: rgba(59, 130, 246, 0.1); }
.v-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #3b82f6;
  box-shadow: 0 0 8px #3b82f6;
}

#st {
  font-size: 0.75rem;
  font-weight: 700;
  padding: 5px 10px;
  border-radius: 99px;
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid rgba(16, 185, 129, 0.35);
  color: #10b981;
  white-space: nowrap;
}
#st.d {

nav {

  flex-wrap: wrap;
  gap: 8px;
  padding: 14px 16px 8px;
  max-width: 860px;
  margin: auto;
}
nav button { flex: 0 1 auto; }

main { max-width: 860px; margin: auto; padding: 4px 16px; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.c {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 16px;
  margin: 14px 0;
  box-shadow: var(--glass-highlight), 0 6px 20px -4px rgba(0, 0, 0, 0.18);

}

/* Visitor Stats Cards inside General Tab */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-top: 10px;

.stat-card {
  background: var(--inp);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 14px 16px;
}
.stat-card span {

  font-size: 0.76rem;
  font-weight: 700;

}
.stat-card strong {

  color: var(--tx);

}
.stat-card small {

}

h2 { font-size: 1.05rem; margin: 0 0 8px; font-weight: 800; }
label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--mu); margin-top: 10px; }

input:not([type="checkbox"]), textarea, select {
  display: block;
  width: 100%;
  margin-top: 5px;
  padding: 10px 12px;
  font: 500 0.95rem var(--font-sans);
  color: var(--tx);
  background: var(--inp);
  border: 1px solid var(--bd);
  border-radius: 10px;
  transition: border-color 0.2s ease;
}
input:focus, textarea:focus, select:focus, button:focus-visible {
  outline: 2px solid var(--ac-light);
  outline-offset: 1px;
}

.g { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 12px; }
.t { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--bd); margin-bottom: 4px; }
.t b { font-size: 0.95rem; display: inline-flex; align-items: center; gap: 8px; }
.t span { display: flex; gap: 6px; }

.cat-dot {

  height: 10px;

}

button {

  border-radius: 10px;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);

button:hover:not(:disabled) { border-color: var(--bd-hover); transform: translateY(-1px); }
button.p { background: var(--ac-light); border-color: var(--ac-light); color: #0f172a; font-weight: 700; }
html[data-theme="light"] button.p { color: #fff; }
button.p:hover:not(:disabled) { background: var(--ac); }
button:disabled { opacity: 0.6; cursor: not-allowed; }
.ic { padding: 5px 10px; font-size: 0.82rem; }

nav button[aria-selected="true"] {

  border-color: var(--ac-light);

html[data-theme="light"] nav button[aria-selected="true"] { color: #fff; }

.bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  display: flex;
  gap: 10px;
  justify-content: center;

  backdrop-filter: blur(12px);

html[data-theme="light"] .bar { background: rgba(248, 250, 252, 0.9); }

.h { color: var(--mu); font-size: 0.8rem; margin: 8px 0 0; }
.sw { display: flex; align-items: center; gap: 10px; font-size: 0.92rem; font-weight: 700; color: var(--tx); cursor: pointer; }
.sw input { width: 18px; height: 18px; accent-color: var(--ac-light); cursor: pointer; }
.pv {
  background: linear-gradient(90deg, #d97706, #f59e0b);

  text-align: center;
  padding: 10px;

  margin-top: 12px;
  font-size: 0.9rem;

.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }

/* Animated Toast Notification */
.toast {
  position: fixed;
  right: 20px;
  bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  z-index: 90;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 13px 16px;
  border-radius: 12px;
  background: rgba(15, 23, 42, 0.92);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border: 1px solid var(--wa-border);
  color: #f8fafc;
  font-size: 0.88rem;
  font-weight: 600;
  box-shadow: var(--glass-highlight), 0 12px 28px rgba(0, 0, 0, 0.4);
  transform: translateX(calc(100% + 40px));
  opacity: 0;
  pointer-events: none;
  transition: transform 0.3s ease, opacity 0.25s ease;
}
html[data-theme="light"] .toast { background: rgba(255, 255, 255, 0.96); color: #0f172a; }
.toast.er { border-color: var(--er-border); }
.toast.show { transform: translateX(0); opacity: 1; pointer-events: auto; }
.toast-ico {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: rgba(34, 197, 94, 0.2);
  border: 1px solid var(--wa-border);
  color: #4ade80;

  place-items: center;
  flex: none;
  font-weight: 800;
  font-size: 0.8rem;

.toast.er .toast-ico {
  background: rgba(239, 68, 68, 0.2);
  border-color: var(--er-border);

/* Password Lock Screen */
#lockScreen {

#lockErr { color: #ef4444; font-size: 0.82rem; font-weight: 600; margin-top: 10px; display: none; }
</style>

<script>
// ==========================================

const DEFAULT_PASS = 'dcz@2026';
const COUNTER_NS = 'dcz_tripura_2026';
// ==========================================

const $ = s => document.querySelector(s),
      clone = o => JSON.parse(JSON.stringify(o)),
      esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Live Visitor Counter State & Fetcher */
let vStats = { uniq: '—', views: '—', updated: 'Loading…' };

async function fetchSingleCount(key) {
  try {
    const r = await fetch('https://api.counterapi.dev/v1/' + COUNTER_NS + '/' + key + '/', { cache: 'no-store' });
    if (!r.ok) return 0;
    const d = await r.json();
    return Number(d.count) || 0;
  } catch (e) {
    return 0;
  }
}

async function refreshVisitorStats(showToastFeedback) {
  const [u, v] = await Promise.all([fetchSingleCount('unique'), fetchSingleCount('views')]);
  vStats.uniq = u.toLocaleString('en-IN');
  vStats.views = v.toLocaleString('en-IN');
  vStats.updated = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  const hdr = $('#hdrUniq');
  if (hdr) hdr.textContent = vStats.uniq;
  const uEl = $('#statUniq');
  if (uEl) uEl.textContent = vStats.uniq;
  const vEl = $('#statViews');
  if (vEl) vEl.textContent = vStats.views;
  const tEl = $('#statTime');
  if (tEl) tEl.textContent = 'Last synced: ' + vStats.updated;

  if (showToastFeedback) say('Visitor stats refreshed!');
}

/* Theme Switcher */
const themeBtn = $('#themeBtn');
function applyTheme(t, save) {
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#f8fafc' : '#070b14';
  themeBtn.textContent = t === 'light' ? '☾' : '☀';
  if (save) { try { localStorage.setItem('dcz-theme', t); } catch (e) {} }
}
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  applyTheme(cur, true);
});

/* Toast Notification */
let toastTimer = null;
function say(t, er) {
  const toastEl = $('#toast');
  const toastMsg = $('#toastMsg');
  const toastIco = $('#toastIco');
  toastMsg.textContent = t;
  toastIco.textContent = er ? '!' : '✓';
  toastEl.classList.toggle('er', !!er);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3600);
}

/* Password Gate Logic */
function getExpectedPass() { const s = ls(); return s.pass || DEFAULT_PASS; }
function checkAuth() {
  if (sessionStorage.getItem('dcz-unlocked') === '1') {
    $('#lockScreen').hidden = true;
    /* By default, mark this browser as admin so your own visits don't inflate numbers */
    if (localStorage.getItem('dcz-is-admin') === null) {
      try { localStorage.setItem('dcz-is-admin', '1'); } catch (e) {}
    }
  } else {
    $('#lockScreen').hidden = false;
    setTimeout(() => $('#pwInput').focus(), 50);
  }
}
$('#lockForm').addEventListener('submit', e => {
  e.preventDefault();
  if ($('#pwInput').value === getExpectedPass()) {
    sessionStorage.setItem('dcz-unlocked', '1');
    if (localStorage.getItem('dcz-is-admin') === null) {
      try { localStorage.setItem('dcz-is-admin', '1'); } catch (err) {}
    }
    $('#pwInput').value = '';
    $('#lockErr').style.display = 'none';
    $('#lockScreen').hidden = true;
    refreshVisitorStats();
    say('Welcome back! Admin panel unlocked.');
  } else {
    $('#lockErr').style.display = 'block';
    $('#pwInput').select();
  }
});
$('#lockBtn').addEventListener('click', () => {
  sessionStorage.removeItem('dcz-unlocked');
  checkAuth();
});
checkAuth();

    if (Array.isArray(c.services) && c.services.length) {
      cfg.services = c.services.map((s, idx) => {
        const meta = CAT_META[s.cat] || CAT_META.design;
        const defSvc = DEFAULT_SERVICES.find(d => d.name === s.name) || DEFAULT_SERVICES[idx] || {};
        return {
          cat: s.cat || 'design',
          name: s.name || '',
          bnName: s.bnName ?? defSvc.bnName ?? '',
          hiName: s.hiName ?? defSvc.hiName ?? '',
          desc: s.desc || '',
          bnDesc: s.bnDesc ?? defSvc.bnDesc ?? '',
          hiDesc: s.hiDesc ?? defSvc.hiDesc ?? '',
          p1: s.p1 || '',
          p2: (s.p2 || '').replace(/^up to\s*/i, ''),
          color: s.color || meta.color,
          icon: s.icon || meta.icon
        };
      });
    } else if (Array.isArray(c.prices)) {
      c.prices.forEach((p, i) => {
        if (cfg.services[i] && p && p.p1) {
          cfg.services[i].p1 = p.p1;
          cfg.services[i].p2 = (p.p2 || '').replace(/^up to\s*/i, '');
        }
      });
    }
  }
  render();
}

function out() {
  const c = clone(cfg),
        t = s => String(s == null ? '' : s).trim(),
        tr = o => Object.fromEntries(Object.entries(o).map(e => [e[0], t(e[1])]));
  c.wa = t(c.wa);
  c.hours = c.hours.filter(r => t(r[0]) || t(r[1])).map(r => [t(r[0]), t(r[1])]);
  c.services = c.services.map(s => {
    const cat = CAT_META[s.cat] ? s.cat : 'design';
    const meta = CAT_META[cat];
    const cleanP2 = t(s.p2).replace(/^up to\s*/i, '');
    return {
      cat: cat,
      name: t(s.name),
      bnName: t(s.bnName) || t(s.name),
      hiName: t(s.hiName) || t(s.name),
      desc: t(s.desc),
      bnDesc: t(s.bnDesc) || t(s.desc),
      hiDesc: t(s.hiDesc) || t(s.desc),
      p1: t(s.p1),
      p2: cleanP2 ? 'up to ' + cleanP2 : '',
      color: s.color || meta.color,
      icon: s.icon || meta.icon
    };
  });
  c.prices = c.services.map(s => ({ p1: s.p1, p2: s.p2 }));
  c.banner = { on: !!c.banner.on, en: t(c.banner.en), bn: t(c.banner.bn), hi: t(c.banner.hi), link: t(c.banner.link) };
  c.packages = c.packages.map(tr).filter(p => p.name || p.price);
  c.faq = c.faq.map(tr).filter(x => x.q || x.a);
  return c;
}

function check(c) {
  if (!/^\d{8,15}$/.test(c.wa)) return 'WhatsApp number must be 8–15 digits with country code, e.g. 918730074910.';
  if (!c.services.length) return 'Please keep at least 1 service in your price list.';
  const si = c.services.findIndex(s => !s.name || !s.p1);
  if (si > -1) return 'Service #' + (si + 1) + ' needs both an English name and a starting price.';
  if (c.banner.on && !c.banner.en) return 'The banner is switched on but has no English text.';
  if (c.banner.link && !/^(https?:\/\/|#|\/)/.test(c.banner.link)) return 'Banner link must start with https://, # or /.';
  const p = c.packages.findIndex(x => !x.name || !x.price);
  if (p > -1) return 'Package ' + (p + 1) + ' needs a name and a price.';
  const f = c.faq.findIndex(x => !x.q || !x.a);
  if (f > -1) return 'Question ' + (f + 1) + ' needs both a question and an answer.';
  return '';
}

const b64 = s => {
  let b = '';
  new TextEncoder().encode(s).forEach(x => b += String.fromCharCode(x));
  return btoa(b);
};
const fromB64 = b => {
  const bin = atob(b.replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
};

/* Build updated JSON-LD OfferCatalog & static HTML cards for index.html SEO */
function numPrice(str) {
  return parseInt(String(str || '').replace(/[^0-9]/g, ''), 10) || 0;
}
function buildOfferSchema(c) {
  return JSON.stringify({
    '@context': 'https://schema.org',
    '@type': 'OfferCatalog',
    'name': 'Digital Creative Zone Price List',
    'itemListElement': c.services.map(s => {
      const minP = numPrice(s.p1);
      const maxP = numPrice(s.p2) || minP;
      return {
        '@type': 'Offer',
        'itemOffered': {
          '@type': 'Service',
          'name': s.name,
          'description': s.desc
        },
        'priceSpecification': {
          '@type': 'PriceSpecification',
          'minPrice': minP,
          'maxPrice': maxP,
          'priceCurrency': 'INR'
        }
      };
    })
  }).replace(/<\//g, '<\\/');
}
function buildStaticCardsHTML(c) {
  return c.services.map((item, n) => {
    const pRange = item.p1 + (item.p2 ? ' – ' + item.p2.replace(/^up to\s*/i, '') : '');
    const waText = encodeURIComponent("Hi Digital Creative Zone, I'd like a quote for " + item.name + " (" + pRange + ").");
    return '<article class="item" data-cat="' + esc(item.cat) + '" style="--c: ' + esc(item.color) + '; --i: ' + n + '">' +
      '<div class="item-top"><div class="ico" aria-hidden="true"><svg viewBox="0 0 24 24">' + item.icon + '</svg></div>' +
      '<div class="name">' + esc(item.name) + '<small>' + esc(item.desc) + '</small></div></div>' +
      '<div class="item-bottom"><div class="prices"><div class="from">Starting from</div><div class="p1">' + esc(item.p1) + '</div>' +
      '<div class="p2">' + esc(item.p2) + '</div></div>' +
      '<a class="item-quote" href="https://wa.me/' + c.wa + '?text=' + waText + '" target="_blank" rel="noopener noreferrer" aria-label="Enquire about ' + esc(item.name) + ' on WhatsApp">Enquire →</a></div></article>';
  }).join('');
}

async function syncIndexHtmlSEO(c, repo, br, H) {
  const indexUrl = 'https://api.github.com/repos/' + repo + '/contents/index.html';
  const r = await fetch(indexUrl + '?ref=' + encodeURIComponent(br), { headers: H, cache: 'no-store' });
  if (!r.ok) return false;
  const data = await r.json();
  let html = fromB64(data.content);
  const updatedHtml = html
    .replace(/(<script type="application\/ld\+json" id="ld-offers">)[\s\S]*?(<\/script>)/, (_, p1, p2) => p1 + buildOfferSchema(c) + p2)
    .replace(/(<!--SERVICES:START-->)[\s\S]*?(<!--SERVICES:END-->)/, (_, p1, p2) => p1 + buildStaticCardsHTML(c) + p2);
  if (updatedHtml === html) return true;
  const putRes = await fetch(indexUrl, {
    method: 'PUT',
    headers: Object.assign({ 'Content-Type': 'application/json' }, H),
    body: JSON.stringify({
      message: 'Sync index.html SEO schema & fallback service cards from admin panel',
      content: b64(updatedHtml),
      branch: br,
      sha: data.sha
    })
  });
  return putRes.ok;
}

async function publish() {
  const c = out(), er = check(c);
  if (er) return say(er, 1);
  const s = ls();
  if (!s.tok) return say('Add your GitHub token under Publish & Security first.', 1);
  const repo = s.repo || 'digitalcreativezone/creative-zone1',
        br = s.br || 'main',
        url = 'https://api.github.com/repos/' + repo + '/contents/config.json',
        H = { Authorization: 'Bearer ' + s.tok, Accept: 'application/vnd.github+json' },
        btn = $('#pub');
  btn.disabled = true;
  btn.textContent = 'Publishing…';
  try {
    let sha, r = await fetch(url + '?ref=' + encodeURIComponent(br), { headers: H, cache: 'no-store' });
    if (r.ok) sha = (await r.json()).sha;
    else if (r.status !== 404) throw r.status;
    const body = { message: 'Update site content from admin panel', content: b64(JSON.stringify(c, null, 2) + '\n'), branch: br };
    if (sha) body.sha = sha;
    r = await fetch(url, { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, H), body: JSON.stringify(body) });
    if (!r.ok) throw r.status;

    let seoSynced = false;
    try { seoSynced = await syncIndexHtmlSEO(c, repo, br, H); } catch (_) {}

    dirty = false;
    st();
    say(seoSynced ? 'Published config.json & synced index.html SEO!' : 'Published config.json! Live site updates in ~1 min.');
  } catch (e) {
    say(
      e === 401 ? 'GitHub rejected the token. Create a new one under Publish & Security.' :
      e === 403 || e === 404 ? 'Token cannot write to this repo. Check repo name and Contents permission.' :
      e === 409 ? 'File changed on GitHub while editing. Press Publish again.' :
      'Could not publish. Check your connection or download config.json.',
      1
    );
  }
  btn.disabled = false;
  btn.textContent = 'Publish changes (Config + SEO)';
}

function fromSite() {
  return fetch('config.json?' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
}

document.addEventListener('change', e => {
  if (e.target.id === 'ignoreAdminToggle') {
    const exclude = e.target.checked;
    try { localStorage.setItem('dcz-is-admin', exclude ? '1' : '0'); } catch (_) {}
    say(exclude ? 'Your visits on this browser are now excluded.' : 'Your visits on this browser will now be counted.');
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.p) {
    const val = t.type === 'checkbox' ? t.checked : t.value;
    set(t.dataset.p, val);
    if (/^services\.\d+\.name$/.test(t.dataset.p)) {
      const idx = +t.dataset.p.split('.')[1];
      const titleEl = document.querySelector('[data-svc-title="' + idx + '"]');
      if (titleEl) titleEl.textContent = (idx + 1) + '. ' + (val || 'New Service');
    }
    if (/^services\.\d+\.cat$/.test(t.dataset.p)) {
      const idx = +t.dataset.p.split('.')[1];
      const meta = CAT_META[val] || CAT_META.design;
      cfg.services[idx].color = meta.color;
      cfg.services[idx].icon = meta.icon;
      render();
    }
    dirty = true;
    st();
    if (t.dataset.p.indexOf('banner') === 0 && tab === 'ban') {
      const pv = $('.pv');
      if (pv) pv.textContent = cfg.banner.en || 'Your banner text appears here';
    }
  } else if (t.dataset.s) {
    sv({ [t.dataset.s]: t.value.trim() });
  }
});

document.addEventListener('click', e => {
  if (e.target.id === 'refStatsBtn') {
    refreshVisitorStats(true);
    return;
  }
  const t = e.target.closest('[data-t]');
  if (t) { tab = t.dataset.t; return render(); }
  const b = e.target.closest('[data-a]');
  if (b) {
    const a = b.dataset.a, A = cfg[b.dataset.l], n = +b.dataset.i;
    if (a === 'del') A.splice(n, 1);
    else if (a === 'up' && n > 0) [A[n - 1], A[n]] = [A[n], A[n - 1]];
    else if (a === 'dn' && n < A.length - 1) [A[n + 1], A[n]] = [A[n], A[n + 1]];
    else if (a === 'add') A.push(NEW[b.dataset.l]());
    else if (a === 'ex') EX[b.dataset.l].forEach(x => A.push(clone(x)));
    dirty = true;
    return render();
  }
  if (e.target.id === 'resetSvc') {
    cfg.services = clone(DEFAULT_SERVICES);
    dirty = true;
    render();
    say('Reset to default 9 services.');
  }
  if (e.target.id === 'savePass') {
    const np = $('#newPass').value.trim();
    if (!np) return say('Please enter a new password first.', 1);
    sv({ pass: np });
    $('#newPass').value = '';
    say('Admin password updated on this device.');
  }
  if (e.target.id === 'resetPass') {
    sv({ pass: '' });
    say('Password reset to default (' + DEFAULT_PASS + ').');
  }
  if (e.target.id === 'forget') {
    sv({ tok: '' });
    render();
    say('Token removed from this device.');
  }
  if (e.target.id === 'imb') $('#imp').click();
  if (e.target.id === 'rl') {
    fromSite().then(c => {
      if (!c) return say('Could not load config.json from the site.', 1);
      load(c);
      dirty = false;
      st();
      say('Loaded current content from your live site.');
    });
  }
});

$('#imp').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  f.text().then(x => {
    try {
      load(JSON.parse(x));
      dirty = true;
      st();
      say('Imported config.json. Press Publish changes to put it live.');
    } catch (_) {
      say('That file is not valid JSON.', 1);
    }
  });
  e.target.value = '';
});

$('#pub').addEventListener('click', publish);
$('#dl').addEventListener('click', () => {
  const c = out(), er = check(c);
  if (er) return say(er, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(c, null, 2) + '\n'], { type: 'application/json' }));
  a.download = 'config.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  say('Downloaded config.json!');
});

window.addEventListener('beforeunload', e => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

render();
refreshVisitorStats();
/* Auto-refresh visitor count every 30 seconds while admin panel is open */
setInterval(() => refreshVisitorStats(false), 30000);
fromSite().then(c => { if (c && !dirty) { load(c); dirty = false; st(); } });
</script>
