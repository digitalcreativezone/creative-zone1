/* Theme Switcher */
const themeBtn = $('#themeBtn');
function applyTheme(t, save) {
  const root = document.documentElement;
  root.classList.add('theme-switching');
  root.dataset.theme = t;
  requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(() => root.classList.remove('theme-switching'), 60)));
  document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#f8fafc' : '#070b14';
  themeBtn.textContent = t === 'light' ? '☾' : '☀';
  if (save) { try { localStorage.setItem('dcz-theme', t); } catch (e) {} }
}
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  applyTheme(cur, true);
});
applyTheme(document.documentElement.dataset.theme || 'dark');

/* Toast Notification */
let toastTimer = null;
function say(t, er) {
  const toastEl = $('#toast');
  const toastMsg = $('#toastMsg');
  const toastIco = $('#toastIco');
  toastMsg.textContent = t;
  toastIco.textContent = er ? '!' : '✓';
  toastEl.classList.toggle('er', !!er);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3600);
}

/* Password Gate */
async function sha256(str) {
  if (!(window.crypto && crypto.subtle)) throw new Error('nocrypto');
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function passOk(input) {
  const s = ls();
  if (s.pass) return input === s.pass;
  return (await sha256(input)) === (s.passH || DEFAULT_HASH);
}
function checkAuth() {
  if (sessionStorage.getItem('dcz-unlocked') === '1') {
    $('#lockScreen').hidden = true;
  } else {
    $('#lockScreen').hidden = false;
    setTimeout(() => $('#pwInput').focus(), 50);
  }
}
$('#lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  let ok = false;
  try { ok = await passOk($('#pwInput').value); }
  catch (_) { $('#lockErr').textContent = 'Open this page over https:// to unlock.'; $('#lockErr').style.display = 'block'; return; }
  if (ok) {
    sessionStorage.setItem('dcz-unlocked', '1');
    $('#pwInput').value = '';
    $('#lockErr').style.display = 'none';
    $('#lockScreen').hidden = true;
    say('Welcome back! Admin panel unlocked.');
  } else {
    $('#lockErr').textContent = 'Incorrect password. Please try again.';
    $('#lockErr').style.display = 'block';
    $('#pwInput').select();
  }
});
$('#lockBtn').addEventListener('click', () => {
  sessionStorage.removeItem('dcz-unlocked');
  checkAuth();
});
checkAuth();

function st() {

function render() {

function load(c) {
  cfg = clone(DEF);
  if (c) {
    ['wa', 'hours', 'packages', 'faq'].forEach(k => { if (c[k] != null) cfg[k] = c[k]; });
    cfg.banner = Object.assign(cfg.banner, c.banner);
    if (Array.isArray(c.services) && c.services.length) {
      cfg.services = c.services.map(s => {
        const meta = CAT_META[s.cat] || CAT_META.design;
        return {
          cat: s.cat || 'design',
          name: s.name || '',
          bnName: s.bnName || '',
          desc: s.desc || '',
          bnDesc: s.bnDesc || '',
          p1: s.p1 || '',
          p2: (s.p2 || '').replace(/^up to\s*/i, ''),
          delivery: s.delivery || '24 hrs',
          bnDelivery: s.bnDelivery || '২৪ ঘণ্টা',
          color: s.color || meta.color,
          icon: s.icon || meta.icon
        };
      });
    }
  }
  render();
}

function out() {
  const c = clone(cfg),
        t = s => String(s == null ? '' : s).trim(),
        tr = o => Object.fromEntries(Object.entries(o).map(e => [e[0], t(e[1])]));
  c.wa = t(c.wa);
  c.hours = c.hours.filter(r => t(r[0]) || t(r[1])).map(r => [t(r[0]), t(r[1])]);
  c.services = c.services.map(s => {
    const cat = CAT_META[s.cat] ? s.cat : 'design';
    const meta = CAT_META[cat];
    const cleanP2 = t(s.p2).replace(/^up to\s*/i, '');
    return {
      cat: cat,
      name: t(s.name),
      bnName: t(s.bnName) || t(s.name),
      desc: t(s.desc),
      bnDesc: t(s.bnDesc) || t(s.desc),
      p1: t(s.p1),
      p2: cleanP2 ? 'up to ' + cleanP2 : '',
      delivery: t(s.delivery) || '24 hrs',
      bnDelivery: t(s.bnDelivery) || '২৪ ঘণ্টা',
      color: s.color || meta.color,
      icon: s.icon || meta.icon
    };
  });
  c.banner = { on: !!c.banner.on, en: t(c.banner.en), bn: t(c.banner.bn), link: t(c.banner.link) };
  c.packages = c.packages.map(tr).filter(p => p.name || p.price);
  c.faq = c.faq.map(tr).filter(x => x.q || x.a);
  return c;
}

function check(c) {
  if (!/^\d{8,15}$/.test(c.wa)) return 'WhatsApp number must be 8–15 digits with country code, e.g. 918730074910.';
  if (!c.services.length) return 'Please keep at least 1 service in your price list.';
  const si = c.services.findIndex(s => !s.name || !s.p1);
  if (si > -1) return 'Service #' + (si + 1) + ' needs both an English name and a starting price.';
  if (c.banner.on && !c.banner.en) return 'The banner is switched on but has no English text.';
  if (c.banner.link && !/^(https?:\/\/|#|\/)/.test(c.banner.link)) return 'Banner link must start with https://, # or /.';
  const p = c.packages.findIndex(x => !x.name || !x.price);
  if (p > -1) return 'Package ' + (p + 1) + ' needs a name and a price.';
  const f = c.faq.findIndex(x => !x.q || !x.a);
  if (f > -1) return 'Question ' + (f + 1) + ' needs both a question and an answer.';
  return '';
}

const b64 = s => {
  let b = '';
  new TextEncoder().encode(s).forEach(x => b += String.fromCharCode(x));
  return btoa(b);
};
const fromB64 = b => {
  const bin = atob(b.replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
};

function numPrice(str) {
  return parseInt(String(str || '').replace(/[^0-9]/g, ''), 10) || 0;
}
function buildOfferSchema(c) {
  return JSON.stringify({
    '@context': 'https://schema.org',
    '@type': 'OfferCatalog',
    'name': 'Digital Creative Zone Price List',
    'itemListElement': c.services.map(s => {
      const minP = numPrice(s.p1);
      const maxP = numPrice(s.p2) || minP;
      return {
        '@type': 'Offer',
        'itemOffered': {
          '@type': 'Service',
          'name': s.name,
          'description': s.desc
        },
        'priceSpecification': {
          '@type': 'PriceSpecification',
          'minPrice': minP,
          'maxPrice': maxP,
          'priceCurrency': 'INR'
        }
      };
    })
  }).replace(/<\//g, '<\\/');
}

async function syncIndexHtmlSEO(c, repo, br, H) {
  const indexUrl = 'https://api.github.com/repos/' + repo + '/contents/index.html';
  const r = await fetch(indexUrl + '?ref=' + encodeURIComponent(br), { headers: H, cache: 'no-store' });
  if (!r.ok) return false;
  const data = await r.json();
  let html = fromB64(data.content);
  const reLd = /(<script type="application\/ld\+json" id="ld-offers">)[\s\S]*?(<\/script>)/;
  if (!reLd.test(html)) return 'nomarkers';
  const tel = c.wa.length === 12 && c.wa.indexOf('91') === 0 ? '+91-' + c.wa.slice(2, 7) + '-' + c.wa.slice(7) : '+' + c.wa;
  const updatedHtml = html
    .replace(reLd, (_, p1, p2) => p1 + buildOfferSchema(c) + p2)
    .replace(/("telephone":\s*")[^"]*(")/, (_, p1, p2) => p1 + tel + p2);
  if (updatedHtml === html) return true;
  const putRes = await fetch(indexUrl, {
    method: 'PUT',
    headers: Object.assign({ 'Content-Type': 'application/json' }, H),
    body: JSON.stringify({
      message: 'Sync index.html SEO schema from admin panel',
      content: b64(updatedHtml),
      branch: br,
      sha: data.sha
    })
  });
  return putRes.ok;
}

async function publish() {
  const c = out(), er = check(c);
  if (er) return say(er, 1);
  const s = ls();
  if (!s.tok) return say('Add your GitHub token under Publish & Security first.', 1);
  const repo = s.repo || 'digitalcreativezone/creative-zone1',
        br = s.br || 'main',
        url = 'https://api.github.com/repos/' + repo + '/contents/config.json',
        H = { Authorization: 'Bearer ' + s.tok, Accept: 'application/vnd.github+json' },
        btn = $('#pub');
  btn.disabled = true;
  btn.textContent = 'Publishing…';
  try {
    let sha, r = await fetch(url + '?ref=' + encodeURIComponent(br), { headers: H, cache: 'no-store' });
    if (r.ok) sha = (await r.json()).sha;
    else if (r.status !== 404) throw r.status;
    const body = { message: 'Update site content from admin panel', content: b64(JSON.stringify(c, null, 2) + '\n'), branch: br };
    if (sha) body.sha = sha;
    r = await fetch(url, { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, H), body: JSON.stringify(body) });
    if (!r.ok) throw r.status;

    let seoSynced = false;
    try { seoSynced = await syncIndexHtmlSEO(c, repo, br, H); } catch (_) {}

    dirty = false;
    st();
    say(seoSynced === true ? 'Published config.json & synced index.html SEO!' :
        seoSynced === 'nomarkers' ? 'Published config.json!' :
        'Published config.json! The site shows your changes within seconds.');
  } catch (e) {
    say(
      e === 401 ? 'GitHub rejected the token. Create a new one under Publish & Security.' :
      e === 403 || e === 404 ? 'Token cannot write to this repo. Check repo name and Contents permission.' :
      e === 409 ? 'File changed on GitHub while editing. Press Publish again.' :
      'Could not publish. Check your connection or download config.json.',
      1
    );
  }
  btn.disabled = false;
  btn.textContent = 'Publish changes (Config + SEO)';
}

function fromSite() {
  return fetch('config.json?' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
}

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.p) {
    const val = t.type === 'checkbox' ? t.checked : t.value;
    set(t.dataset.p, val);
    if (/^services\.\d+\.name$/.test(t.dataset.p)) {
      const idx = +t.dataset.p.split('.')[1];
      const titleEl = document.querySelector('[data-svc-title="' + idx + '"]');
      if (titleEl) titleEl.textContent = (idx + 1) + '. ' + (val || 'New Service');
    }
    if (/^services\.\d+\.cat$/.test(t.dataset.p)) {
      const idx = +t.dataset.p.split('.')[1];
      const meta = CAT_META[val] || CAT_META.design;
      cfg.services[idx].color = meta.color;
      cfg.services[idx].icon = meta.icon;
      render();
    }
    dirty = true;
    st();
    if (t.dataset.p.indexOf('banner') === 0 && tab === 'ban') {
      const pv = $('.pv');
      if (pv) pv.textContent = cfg.banner.en || 'Your banner text appears here';
    }
  } else if (t.dataset.s) {
    sv({ [t.dataset.s]: t.value.trim() });
  }
});

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-t]');
  if (t) { tab = t.dataset.t; return render(); }
  const b = e.target.closest('[data-a]');
  if (b) {
    const a = b.dataset.a, A = cfg[b.dataset.l], n = +b.dataset.i;
    if (a === 'del') A.splice(n, 1);
    else if (a === 'up' && n > 0) [A[n - 1], A[n]] = [A[n], A[n - 1]];
    else if (a === 'dn' && n < A.length - 1) [A[n + 1], A[n]] = [A[n], A[n + 1]];
    else if (a === 'add') A.push(NEW[b.dataset.l]());
    else if (a === 'ex') EX[b.dataset.l].forEach(x => A.push(clone(x)));
    dirty = true;
    return render();
  }
  if (e.target.id === 'reloadSvc' || e.target.id === 'rl') {
    fromSite().then(c => {
      if (!c) return say('Could not load config.json from the site.', 1);
      load(c);
      dirty = false;
      st();
      say('Loaded services and settings from config.json.');
    });
  }
  if (e.target.id === 'savePass') {
    const np = $('#newPass').value.trim();
    if (!np) return say('Please enter a new password first.', 1);
    try { sv({ passH: await sha256(np), pass: '' }); } catch (_) { return say('Needs https:// to save a password.', 1); }
    $('#newPass').value = '';
    say('Admin password updated on this device.');
  }
  if (e.target.id === 'resetPass') {
    sv({ pass: '', passH: '' });
    say('Password reset to the default one.');
  }
  if (e.target.id === 'forget') {
    sv({ tok: '' });
    render();
    say('Token removed from this device.');
  }
  if (e.target.id === 'imb') $('#imp').click();
});

$('#imp').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  f.text().then(x => {
    try {
      load(JSON.parse(x));
      dirty = true;
      st();
      say('Imported config.json. Press Publish changes to put it live.');
    } catch (_) {
      say('That file is not valid JSON.', 1);
    }
  });
  e.target.value = '';
});

$('#pub').addEventListener('click', publish);
$('#dl').addEventListener('click', () => {

});

      fauth.onAuthStateChanged(() => ordView());

function ordView() {
  const box = $('#ordBox');
  if (!box || tab !== 'ord' || !fauth) return;
  if (unsub) { unsub(); unsub = null; }
  if (!fauth.currentUser) {
    box.innerHTML = '<label>Email<input id="ordEmail" type="email" autocomplete="username"></label><label>Password<input id="ordPass" type="password" autocomplete="current-password"></label><div class="row"><button type="button" class="p" id="ordLogin">Sign in to view orders</button></div>';
    return;
  }
  unsub = fdb.collection('orders').orderBy('createdAt', 'desc').limit(200).onSnapshot(snap => {
    const out = '<div class="row"><button type="button" id="ordOut">Sign out</button></div>';
    if (!snap.size) { box.innerHTML = '<p class="h">No orders yet.</p>' + out; return; }
    box.innerHTML = out + snap.docs.map(d => {
      const o = d.data(),
            t = o.createdAt && o.createdAt.toDate ? o.createdAt.toDate().toLocaleString('en-IN') : 'just now',
            ph = String(o.phone || '').replace(/[^0-9]/g, '');
      return '<div class="c"><div class="t"><b>' + esc(o.name) + (o.status === 'new' ? ' [NEW]' : ' [DONE]') + '</b><span>' +
        '<button type="button" class="ic" data-oa="done" data-id="' + d.id + '">' + (o.status === 'new' ? 'Mark done' : 'Reopen') + '</button>' +
        '<button type="button" class="ic" data-oa="del" data-id="' + d.id + '">✕</button></span></div>' +
        '<p class="h">' + esc(t) + '</p>' +
        '<p><b>' + esc(o.service) + '</b> × ' + esc(o.qty) + '</p>' +
        '<p class="h">Size: ' + esc(o.size || '-') + ' · Print: ' + (o.print === 'yes' ? 'Yes' : 'No') + ' · Deadline: ' + esc(o.deadline || 'Flexible') + '</p>' +
        '<div class="row">' + (o.phone ? '<a href="tel:' + esc(o.phone) + '">Call ' + esc(o.phone) + '</a>' : '') +
        (ph ? '<a href="https://wa.me/' + (ph.length === 10 ? '91' : '') + ph + '" target="_blank" rel="noopener">WhatsApp customer</a>' : '') + '</div></div>';
    }).join('');
  }, () => { box.innerHTML = '<p class="h">Could not load orders. Check your login and Firestore rules.</p><div class="row"><button type="button" id="ordOut">Sign out</button></div>'; });
}

document.addEventListener('click', async e => {
  const id = e.target.id, a = e.target.dataset.oa;
  if (id === 'ordLogin') {
    try { await fauth.signInWithEmailAndPassword($('#ordEmail').value.trim(), $('#ordPass').value); }
    catch (_) { say('Wrong email or password.', 1); }
  }
  if (id === 'ordOut') fauth.signOut();
  if (a === 'del' && confirm('Delete this order?')) fdb.collection('orders').doc(e.target.dataset.id).delete().catch(() => say('Could not delete.', 1));
  if (a === 'done') {
    try {
      const ref = fdb.collection('orders').doc(e.target.dataset.id), s = await ref.get();
      await ref.update({ status: s.data().status === 'new' ? 'done' : 'new' });
    } catch (_) { say('Could not update the order.', 1); }
  }
});
